spring:
  application:
    name: job-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/smarthire_jobs}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: ${SERVER_PORT:8084}

job:
  integrations:
    ai-analysis-service:
      base-url: ${JOB_INTEGRATIONS_AI_ANALYSIS_SERVICE_BASE_URL:http://localhost:8083}
    application-service:
      base-url: ${JOB_INTEGRATIONS_APPLICATION_SERVICE_BASE_URL:http://localhost:8085}
    auth-service:
      base-url: ${JOB_INTEGRATIONS_AUTH_SERVICE_BASE_URL:http://localhost:8081}
