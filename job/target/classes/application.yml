spring:
  application:
    name: job-service
  datasource:
    url: jdbc:postgresql://localhost:5432/smarthire_jobs
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: 8084
