spring:
  application:
    name: ai_analysis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3}
          temperature: ${OLLAMA_TEMPERATURE:0.2}
server:
  port: 8083

analysis:
  engine: ${ANALYSIS_ENGINE:llm}
  storage: ${ANALYSIS_STORAGE:redis}
  redis-key-prefix: ${ANALYSIS_REDIS_KEY_PREFIX:smarthire:analysis}
  result-ttl: ${ANALYSIS_RESULT_TTL:PT24H}
  document-service-base-url: ${DOCUMENT_SERVICE_BASE_URL:http://localhost:8082}
  ollama-model: ${OLLAMA_MODEL:llama3}
  ollama-temperature: ${OLLAMA_TEMPERATURE:0.2}
