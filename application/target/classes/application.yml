spring:
  application:
    name: application-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/smarthire_application}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: ${SERVER_PORT:8085}

application:
  integrations:
    document-service:
      base-url: ${APPLICATION_INTEGRATIONS_DOCUMENT_SERVICE_BASE_URL:http://localhost:8082}
    job-service:
      base-url: ${APPLICATION_INTEGRATIONS_JOB_SERVICE_BASE_URL:http://localhost:8084}
