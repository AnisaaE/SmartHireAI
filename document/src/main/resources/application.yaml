spring:
  application:
    name: document
  mongodb:
    uri: ${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/smarthire_document}}}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

document:
  integrations:
    application-service:
      base-url: ${DOCUMENT_INTEGRATIONS_APPLICATION_SERVICE_BASE_URL:http://localhost:8085}
    ai-analysis-service:
      base-url: ${DOCUMENT_INTEGRATIONS_AI_ANALYSIS_SERVICE_BASE_URL:http://localhost:8083}

server:
  port: 8082
