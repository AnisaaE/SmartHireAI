spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/smarthire_auth
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: 8081

security:
  jwt:
    secret: change-this-secret-key-before-production-change-this-secret-key
    access-token-expiration-ms: 3600000
